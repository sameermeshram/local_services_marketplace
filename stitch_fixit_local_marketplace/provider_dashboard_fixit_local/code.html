<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FixIt Local - Provider Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-tab-indicator {
            position: relative;
        }
        .active-tab-indicator::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #005c55;
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-container": "#5c2400",
                    "inverse-primary": "#80d5cb",
                    "tertiary-container": "#5f6a7f",
                    "surface-container": "#eeeeed",
                    "outline": "#6e7977",
                    "surface-bright": "#f9f9f8",
                    "primary": "#005c55",
                    "surface": "#f9f9f8",
                    "on-background": "#1a1c1c",
                    "error": "#ba1a1a",
                    "surface-container-low": "#f3f4f3",
                    "on-error": "#ffffff",
                    "surface-container-high": "#e8e8e7",
                    "primary-container": "#0f766e",
                    "tertiary-fixed": "#d8e3fb",
                    "on-error-container": "#93000a",
                    "surface-dim": "#dadad9",
                    "secondary-container": "#fd761a",
                    "outline-variant": "#bdc9c6",
                    "on-primary": "#ffffff",
                    "on-tertiary-fixed": "#111c2d",
                    "on-primary-container": "#a3faef",
                    "on-surface": "#1a1c1c",
                    "error-container": "#ffdad6",
                    "on-tertiary-fixed-variant": "#3c475a",
                    "on-secondary-fixed-variant": "#783200",
                    "on-primary-fixed-variant": "#00504a",
                    "primary-fixed-dim": "#80d5cb",
                    "on-primary-fixed": "#00201d",
                    "inverse-surface": "#2f3130",
                    "secondary-fixed-dim": "#ffb690",
                    "on-secondary": "#ffffff",
                    "secondary": "#9d4300",
                    "on-secondary-fixed": "#341100",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-container": "#e2ebff",
                    "background": "#f9f9f8",
                    "inverse-on-surface": "#f1f1f0",
                    "surface-variant": "#e2e2e2",
                    "primary-fixed": "#9cf2e8",
                    "secondary-fixed": "#ffdbca",
                    "tertiary": "#475266",
                    "surface-tint": "#006a63",
                    "on-surface-variant": "#3e4947",
                    "on-tertiary": "#ffffff",
                    "surface-container-highest": "#e2e2e2",
                    "tertiary-fixed-dim": "#bcc7de"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-max": "1280px",
                    "gutter": "24px",
                    "margin-mobile": "16px",
                    "base": "4px",
                    "margin-desktop": "32px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Inter"],
                    "headline-md": ["Inter"],
                    "display": ["Inter"],
                    "headline-sm": ["Inter"],
                    "body-sm": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-md": ["Inter"],
                    "headline-lg": ["Inter"],
                    "body-md": ["Inter"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "display": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
</head>
<body class="bg-surface text-on-surface min-h-screen">
<!-- SideNavBar (Authority: JSON/Manual) -->
<aside class="fixed left-0 top-0 h-full w-[280px] bg-surface border-r border-outline-variant flex flex-col h-screen py-8 z-50">
<div class="px-6 mb-8">
<h1 class="text-headline-md font-headline-md font-bold text-primary">FixIt Local</h1>
<p class="font-label-md text-label-md text-on-surface-variant">Local Service Marketplace</p>
</div>
<nav class="flex-1 overflow-y-auto">
<ul class="space-y-1">
<!-- Active Item -->
<li>
<a class="flex items-center gap-3 bg-primary-container/10 text-primary border-l-4 border-primary px-6 py-4 font-bold transition-colors duration-200" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label-md text-label-md">Home</span>
</a>
</li>
<li>
<a class="flex items-center gap-3 text-on-surface-variant px-6 py-4 hover:text-primary hover:bg-surface-container-high transition-colors duration-200" href="#">
<span class="material-symbols-outlined">search</span>
<span class="font-label-md text-label-md">Search</span>
</a>
</li>
<li>
<a class="flex items-center gap-3 text-on-surface-variant px-6 py-4 hover:text-primary hover:bg-surface-container-high transition-colors duration-200" href="#">
<span class="material-symbols-outlined">calendar_month</span>
<span class="font-label-md text-label-md">My Bookings</span>
</a>
</li>
<li>
<a class="flex items-center gap-3 text-on-surface-variant px-6 py-4 hover:text-primary hover:bg-surface-container-high transition-colors duration-200" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-md text-label-md">Profile</span>
</a>
</li>
<li>
<a class="flex items-center gap-3 text-on-surface-variant px-6 py-4 hover:text-primary hover:bg-surface-container-high transition-colors duration-200 relative" href="#">
<span class="material-symbols-outlined">notifications</span>
<span class="font-label-md text-label-md">Notifications</span>
<span class="absolute right-6 top-1/2 -translate-y-1/2 w-2 h-2 bg-secondary rounded-full"></span>
</a>
</li>
</ul>
</nav>
<div class="px-6 mt-auto">
<button class="w-full py-3 px-4 bg-primary text-on-primary rounded-xl font-bold flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined" style="font-size: 20px;">swap_horiz</span>
                Switch to Customer
            </button>
<button class="w-full mt-4 flex items-center gap-3 text-on-surface-variant px-6 py-4 hover:text-error transition-colors">
<span class="material-symbols-outlined">logout</span>
<span class="font-label-md text-label-md">Logout</span>
</button>
</div>
</aside>
<!-- TopAppBar -->
<header class="sticky top-0 z-40 w-full bg-surface/90 backdrop-blur-md border-b border-outline-variant flex justify-between items-center px-margin-desktop h-16 ml-[280px] max-w-[calc(100%-280px)]">
<div class="flex items-center gap-4">
<h2 class="font-headline-sm text-headline-sm text-primary font-bold">Provider Dashboard</h2>
</div>
<div class="flex items-center gap-6">
<!-- Availability Toggle -->
<div class="flex items-center bg-surface-container rounded-full p-1 border border-outline-variant">
<button class="px-4 py-1.5 rounded-full text-label-md font-bold transition-all duration-300 bg-primary text-on-primary shadow-sm" id="btn-available" onclick="toggleStatus(true)">
                    Available
                </button>
<button class="px-4 py-1.5 rounded-full text-label-md font-bold transition-all duration-300 text-on-surface-variant" id="btn-offline" onclick="toggleStatus(false)">
                    Offline
                </button>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer hover:text-primary transition-colors">notifications</span>
</div></div></header></body></html>
